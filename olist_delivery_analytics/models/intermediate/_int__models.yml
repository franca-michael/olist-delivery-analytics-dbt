version: 2

models:
  - name: int_order_items__aggregated_to_order
    description: One row per order that has items. Item totals rolled up to the order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_payments__aggregated_to_order
    description: One row per order that has payments. Payment totals rolled up to the order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_reviews__latest_per_order
    description: >
      One row per order that has reviews. When an order has more than one review,
      keeps the most recent one, as the customer's final opinion.
    columns:
      - name: order_id
        data_tests: [unique, not_null]