version: 2

models:
  - name: int_order_items__aggregated_to_order
    description: One row per order that has items. Item totals rolled up to the order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_payments__aggregated_to_order
    description: One row per order that has payments. Payment totals rolled up to the order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_reviews__latest_per_order
    description: >
      One row per order that has reviews. When an order has more than one review,
      keeps the most recent one, as the customer's final opinion.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_orders__delivery_status
    description: >
      One row per order, with the OTIF flags. Rules: finalized = delivered, canceled or unavailable
      (orders in transit are left out of the denominator); in full = status delivered with a
      delivery date (proxy, Olist has no ordered x delivered quantity); on time = delivered by the
      end of the promised day (date comparison, not time); OTIF = on time and in full, so canceled
      and unavailable count as failures.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: is_finalized
        data_tests: [not_null]
      - name: is_on_time
        data_tests: [not_null]
      - name: is_otif
        data_tests: [not_null]
      - name: delivery_delay_days
        description: Days between the promised and the actual delivery date. Positive is late, negative is early. Null when not delivered.