version: 2

models:
  - name: dim_date
    description: One row per calendar day from 2016-01-01 to 2018-12-31.
    columns:
      - name: date_day
        description: Primary key.
        data_tests: [unique, not_null]
  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests: [unique, not_null]
  - name: dim_products
    description: One row per product, with the category in Portuguese and English.
    columns:
      - name: product_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: product_category_name_english
        description: English category name. Falls back to the Portuguese name when the source has no translation.