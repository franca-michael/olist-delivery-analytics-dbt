version: 2

models:
  - name: dim_date
    description: One row per calendar day from 2016-01-01 to 2018-12-31.
    columns:
      - name: date_day
        description: Primary key.
        data_tests: [unique, not_null]
  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests: [unique, not_null]
  - name: dim_products
    description: One row per product, with the category in Portuguese and English.
    columns:
      - name: product_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: product_category_name_english
        description: English category name. Falls back to the Portuguese name when the source has no translation.
  - name: dim_customers
    description: >
      One row per real customer (customer_unique_id). Location from the most recent order;
      first and last purchase and number of orders.
    columns:
      - name: customer_unique_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: orders_count
        description: Number of orders placed by the customer.
  - name: fct_order_items
    description: One row per item within an order.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_olist__order_items')
    columns:
      - name: order_item_sk
        description: Primary key. Surrogate key from order_id + order_item_id.
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id